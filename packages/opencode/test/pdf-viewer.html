<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDF ReadTool Viewer - OpenCode Test</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      height: 100vh;
      overflow: hidden;
      background: #f5f5f5;
    }

    .header {
      background: #2c3e50;
      color: white;
      padding: 15px 20px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    .header h1 {
      font-size: 20px;
      margin-bottom: 5px;
    }

    .header .stats {
      font-size: 12px;
      opacity: 0.8;
    }

    .upload-area {
      padding: 20px;
      background: white;
      border-bottom: 1px solid #ddd;
    }

    .upload-btn {
      background: #3498db;
      color: white;
      padding: 10px 20px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      margin-right: 10px;
    }

    .upload-btn:hover {
      background: #2980b9;
    }

    .showcase-btn {
      background: #9b59b6;
      color: white;
      padding: 10px 20px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
    }

    .showcase-btn:hover {
      background: #8e44ad;
    }

    .container {
      display: flex;
      height: calc(100vh - 140px);
      gap: 10px;
      padding: 10px;
    }

    .left-panel {
      flex: 1;
      background: white;
      border-radius: 8px;
      overflow: auto;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      padding: 20px;
    }

    .right-panel {
      flex: 1;
      background: white;
      border-radius: 8px;
      overflow: auto;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      padding: 20px;
    }

    .panel-title {
      font-size: 14px;
      font-weight: bold;
      color: #2c3e50;
      margin-bottom: 15px;
      padding-bottom: 10px;
      border-bottom: 2px solid #3498db;
    }

    .pdf-page {
      margin-bottom: 20px;
      border: 1px solid #ddd;
      page-break-inside: avoid;
    }

    canvas {
      max-width: 100%;
      height: auto;
      display: block;
    }

    .text-block {
      background: #f8f9fa;
      border-left: 4px solid #3498db;
      padding: 12px;
      margin: 10px 0;
      font-family: 'Courier New', monospace;
      font-size: 12px;
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    .text-block .label {
      color: #3498db;
      font-weight: bold;
      display: block;
      margin-bottom: 8px;
      font-size: 11px;
    }

    .image-block {
      border: 2px solid #e74c3c;
      margin: 15px 0;
      padding: 15px;
      background: #fff;
      text-align: center;
    }

    .image-block .label {
      color: #e74c3c;
      font-weight: bold;
      display: block;
      margin-bottom: 10px;
      font-size: 11px;
    }

    .image-block img {
      max-width: 100%;
      border: 1px solid #ddd;
      margin-top: 5px;
    }

    .extracted-image-item {
      margin-bottom: 20px;
      padding: 15px;
      border: 1px solid #ddd;
      border-radius: 4px;
      background: #fafafa;
    }

    .extracted-image-item .image-info {
      font-size: 11px;
      color: #666;
      margin-bottom: 10px;
      font-family: 'Courier New', monospace;
    }

    .extracted-image-item img {
      max-width: 100%;
      border: 1px solid #ddd;
    }

    .timing {
      background: #e8f5e9;
      padding: 10px;
      margin: 10px 0;
      border-radius: 4px;
      font-size: 12px;
      font-family: 'Courier New', monospace;
    }

    .timing .time-label {
      color: #2e7d32;
      font-weight: bold;
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: #999;
    }

    .empty-state-icon {
      font-size: 48px;
      margin-bottom: 20px;
    }

    #fileInput {
      display: none;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>📄 PDF ReadTool Viewer - OpenCode Test</h1>
    <div class="stats" id="stats">Upload a PDF or load showcase example</div>
  </div>

  <div class="upload-area">
    <input type="file" id="fileInput" accept="application/pdf">
    <button class="upload-btn" onclick="document.getElementById('fileInput').click()">
      📁 Upload PDF
    </button>
    <button class="showcase-btn" onclick="loadShowcase()">
      ✨ Load Showcase Example
    </button>
  </div>

  <div class="container">
    <div class="left-panel">
      <div class="panel-title">📖 Original PDF</div>
      <div id="pdfOriginal">
        <div class="empty-state">
          <div class="empty-state-icon">📄</div>
          <div>Upload a PDF file to see the original rendering</div>
        </div>
      </div>
    </div>

    <div class="right-panel">
      <div class="panel-title">🔧 ReadTool Output (structuredContent)</div>
      <div id="structuredOutput"></div>
    </div>
  </div>

  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    let currentPdf = null;
    const timings = {};

    document.getElementById('fileInput').addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (file) {
        await processPDF(file);
      }
    });

    async function processPDF(file) {
      const startTime = performance.now();

      // Clear previous content
      document.getElementById('pdfOriginal').innerHTML = '';
      document.getElementById('structuredOutput').innerHTML = '';

      const arrayBuffer = await file.arrayBuffer();
      const loadingTask = pdfjsLib.getDocument({ data: arrayBuffer });
      const pdf = await loadingTask.promise;
      currentPdf = pdf;

      timings.load = performance.now() - startTime;

      // Render original PDF
      await renderOriginalPDF(pdf);

      // Process as ReadTool would
      await processAsReadTool(pdf, file.name);

      // Update stats
      updateStats(file.name, pdf.numPages);
    }

    async function renderOriginalPDF(pdf) {
      const container = document.getElementById('pdfOriginal');
      const renderStart = performance.now();

      // Only render first 3 pages for large PDFs
      const maxPages = Math.min(pdf.numPages, 3);
      container.innerHTML = `<div style="padding: 20px; text-align: center; color: #666;">
        Rendering first ${maxPages} of ${pdf.numPages} pages...
      </div>`;

      for (let pageNum = 1; pageNum <= maxPages; pageNum++) {
        const page = await pdf.getPage(pageNum);
        const viewport = page.getViewport({ scale: 1.0 });

        const pageDiv = document.createElement('div');
        pageDiv.className = 'pdf-page';

        const canvas = document.createElement('canvas');
        const context = canvas.getContext('2d');
        canvas.height = viewport.height;
        canvas.width = viewport.width;

        await page.render({
          canvasContext: context,
          viewport: viewport
        }).promise;

        pageDiv.appendChild(canvas);
        container.appendChild(pageDiv);
      }

      if (pdf.numPages > maxPages) {
        container.innerHTML += `<div style="padding: 20px; text-align: center; color: #999;">
          ... ${pdf.numPages - maxPages} more pages not shown ...
        </div>`;
      }

      timings.render = performance.now() - renderStart;
    }

    async function processAsReadTool(pdf, filename) {
      const processStart = performance.now();

      // Send PDF to backend server which uses actual processPdfFile() from pdf.ts
      const formData = new FormData();

      // Get the original file from file input
      const fileInput = document.getElementById('fileInput');
      if (fileInput.files && fileInput.files[0]) {
        formData.append('pdf', fileInput.files[0]);

        try {
          const response = await fetch('/api/process-pdf', {
            method: 'POST',
            body: formData
          });

          const result = await response.json();

          if (result.success) {
            timings.process = performance.now() - processStart;
            renderStructuredContent(result.structuredContent);
            console.log(`✅ Processed using actual pdf.ts functions!`);
            console.log(`   Extracted ${result.structuredContent.length} items`);
          } else {
            throw new Error(result.error || 'Unknown error');
          }

        } catch (err) {
          console.error('❌ Failed to process PDF:', err);
          alert('Failed to process PDF. See console for details.');
        }
      } else {
        console.error('No file selected');
      }
    }

    function renderStructuredContent(structuredContent) {
      const container = document.getElementById('structuredOutput');

      // Add timing info
      const timingDiv = document.createElement('div');
      timingDiv.className = 'timing';
      timingDiv.innerHTML = `
        <div><span class="time-label">PDF Load:</span> ${timings.load.toFixed(2)}ms</div>
        <div><span class="time-label">Original Render:</span> ${timings.render.toFixed(2)}ms</div>
        <div><span class="time-label">ReadTool Process:</span> ${timings.process.toFixed(2)}ms</div>
        <div><span class="time-label">Total:</span> ${(timings.load + timings.render + timings.process).toFixed(2)}ms</div>
      `;
      container.appendChild(timingDiv);

      structuredContent.forEach((item, idx) => {
        if (item.type === 'text') {
          const textBlock = document.createElement('div');
          textBlock.className = 'text-block';
          textBlock.innerHTML = `
            <span class="label">TEXT (item #${idx})</span>
            ${escapeHtml(item.text)}
          `;
          container.appendChild(textBlock);
        } else if (item.type === 'file') {
          const imageBlock = document.createElement('div');
          imageBlock.className = 'image-block';
          imageBlock.innerHTML = `
            <span class="label">IMAGE (item #${idx}): ${item.filename}</span>
            <div style="font-size: 10px; color: #999; margin-bottom: 5px;">
              MIME: ${item.mime} | Size: ${(item.url.length / 1024).toFixed(2)} KB (base64)
            </div>
            <img src="${item.url}" />
          `;
          container.appendChild(imageBlock);
        }
      });
    }

    function updateStats(filename, numPages) {
      document.getElementById('stats').textContent =
        `📊 ${filename} | ${numPages} pages | ⏱️ Total: ${(timings.load + timings.render + timings.process).toFixed(2)}ms`;
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

          },
          {

      // Render showcase
      document.getElementById('pdfOriginal').innerHTML = `

      `;

      timings.load = 12.5;

      renderStructuredContent(showcase.structuredContent);

      document.getElementById('stats').textContent =

  </script>
</body>
